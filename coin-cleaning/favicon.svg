<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Frame -->
  <rect width="64" height="64" rx="14" fill="#0f1117"/>

  <!-- Golden Coin Body -->
  <circle cx="32" cy="32" r="25" fill="url(#coinGrad)" filter="url(#subtleGlow)"/>
  
  <!-- Outer Reeded Bevel Rim -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>
  
  <!-- Inner Dentil Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#78350f" stroke-width="1" stroke-dasharray="2, 2"/>

  <!-- Classical Numismatic Emblem (Center Star & Laurel Accent) -->
  <!-- Center Star Motif -->
  <polygon points="32,18 35,26 44,26 37,31 40,39 32,34 24,39 27,31 20,26 29,26" 
           fill="#fef08a" 
           stroke="#b45309" 
           stroke-width="0.8"/>
  
  <!-- Lower Mint Year / Accent Bar -->
  <rect x="25" y="43" width="14" height="2" rx="1" fill="#fef08a" opacity="0.9"/>
</svg>
