<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LCRDCCZRXM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-LCRDCCZRXM');
  </script>
</head>
<body>

    <canvas id="gameCanvas" tabindex="1"></canvas>

    <div id="overlays">
        <div id="startMenu">
            <h1>Microbe</h1>
            <input type="text" id="playerNameInput" placeholder="Player name" maxlength="15" autofocus>
            <div style="margin: 12px 0; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <label for="playerColor" style="color: #94a3b8; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600;">COLOR</label>
                <input type="color" id="playerColor" value="#ff3b30" style="cursor: pointer; border: none; background: transparent; width: 28px; height: 28px;">
            </div>

            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="playBtn" style="flex: 1;">Play</button>
                <button id="spectateBtn" style="flex: 1;">Spectate</button>
            </div>
            <div class="controls-hint">Mouse: Move • Space: Split • W: Eject</div>
            <div id="spectateTip" class="hidden controls-hint" style="margin-top: 15px;">Press ESC to return to menu</div>
            <div id="menuLeaderboardBox">
                <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 10px;">
                    <button id="tabGlobal" style="padding: 4px 10px; font-size: 11px; background: #22c55e; color: #052e16; border: none; border-radius: 2px; font-weight: 700; cursor: pointer;">GLOBAL</button>
                    <button id="tabPersonal" style="padding: 4px 10px; font-size: 11px; background: #334155; color: #cbd5e1; border: none; border-radius: 2px; font-weight: 600; cursor: pointer;">MY SCORES</button>
                </div>
                <ol id="menuLeaderboardList" style="margin: 0; padding-left: 20px; font-size: 12px; color: #cbd5e1;">
                    <li>Loading...</li>
                </ol>
            </div>
        </div>

        <div id="deathPopup" class="hidden">
            <h1>You Died</h1>
            <div style="margin: 16px 0; font-size: 15px; color: #cbd5e1; font-family: 'JetBrains Mono', monospace;">
                <p style="margin: 6px 0;">Score: <span id="deathScoreDisplay" style="font-weight: 700; color: #38bdf8;">0</span></p>
                <p style="margin: 6px 0;">Global Rank: <span id="globalPlacementDisplay" style="font-weight: 700; color: #f8fafc;">Loading...</span></p>
                <p style="margin: 6px 0;">Personal Rank: <span id="personalPlacementDisplay" style="font-weight: 700; color: #f8fafc;">Loading...</span></p>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; justify-content: center;">
                <button id="submitScoreBtn" style="padding: 10px; background: #22c55e; color: #052e16; border: 1px solid #16a34a; border-radius: 3px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;">Submit Score</button>
                <button id="skipScoreBtn" style="padding: 10px; background: #334155; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); border-radius: 3px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; cursor: pointer;">Menu</button>
            </div>
        </div>

        <div id="leaderboard" class="hidden">
            <h3>Leaderboard</h3>
            <div id="leaderboardList"></div>
        </div>

        <div id="scoreBox" class="hidden">
            MASS: <span id="scoreDisplay">0</span>
        </div>
    </div>

    <!-- Load scripts in order -->
    <script src="config.js?v=5"></script>
    <script src="utils.js?v=5"></script>
    <script src="entities.js?v=5"></script>
    <script src="bot.js?v=5"></script>
    <script src="player.js?v=5"></script>
    <script src="game.js?v=5"></script>
    <script src="renderer.js?v=5"></script>
    <script src="main.js?v=5"></script>

<script type="module" src="../js/firebase-config.js"></script>
<script type="module" src="../js/tracker.js"></script>
</body>
</html>
